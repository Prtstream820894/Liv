name: Auto Update Sony Playlist

on:
  schedule:
    - cron: '*/30 * * * *' # हर 30 मिनट में रन होगा
  workflow_dispatch: # GitHub से मैन्युअल रन करने का बटन

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: python update_playlist.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add new_sony.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update resolved playlist [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
